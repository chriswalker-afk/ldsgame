name: Verify live LDS Game custom domain
on:
  pull_request:
    paths:
      - scripts/verify-live-domain.mjs
      - tests/browser_smoke.py
      - .github/workflows/verify-live-domain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HTTPS, original Netlify parity and all twelve deployed resources
        run: node scripts/verify-live-domain.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test requirements
        run: python -m pip install --disable-pip-version-check playwright
      - name: Exercise the live board, photos, review mode and dice in Chrome
        env:
          LDS_GAME_URL: https://lds.mrwalkermaths.com/
        run: python tests/browser_smoke.py
